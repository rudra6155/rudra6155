name: rudra-smi

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 08:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/claudia/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.68.0 brotli==1.2.1
      - name: Build scenes
        run: python scripts/claudia/build.py
      - name: Refresh live stats
        run: python scripts/claudia/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/claudia/schedule.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: refresh profile scenes and rudra-smi stats"
          git push
